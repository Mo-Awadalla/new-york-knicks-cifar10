[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knicks-cifar10"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "Pillow>=9.1", "torch>=2.11", "torchvision>=0.15"]

[project.optional-dependencies]
report = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "matplotlib>=3.9", "reportlab>=4.2", "pypdf>=5", "pymupdf>=1.24"]

[project.scripts]
knicks-cifar = "knicks_cifar:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["knicks_cifar", "knicks_methods", "knicks_tta"]
